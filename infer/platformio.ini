; PlatformIO 项目配置（玲珑 linglong）
;
; 编译入口及全部源码保持扁平：本文件与 *.ino / *.c / *.cpp / *.h 同目录，
; 通过 [platformio] src_dir = . 让 PlatformIO 直接在工程根目录收集源码，
; 不做任何目录搬迁。
;
; 两个平台环境：
;   m5core2   —— M5Stack Core2（ESP32，16MB Flash，8MB PSRAM，QSPI PSRAM）
;   m5cores3  —— M5Stack CoreS3（ESP32-S3，16MB Flash，8MB QSPI PSRAM）
;
; 依赖：
;   - M5Unified / M5GFX 来自 PlatformIO registry（m5stack 组织，版本钉死）
;   - Animac 为用户自研库，**源码以工程内 vendor/Animac/ 为准**（随仓库分发），
;     经 src_dir=. 递归编译为项目源码、build_flags 注入头文件路径；
;     不要再引用外部副本（Arduino15 等），避免两份源码漂移或重复定义。
;
; 依赖的 PlatformIO 平台：pioarduino fork 的 espressif32，URL 钉死具体版本（见 [env]），
; 不要用 stable 浮动 URL（防环境漂移）；升级平台 = 主动改版本号并全量验证。
;
; 用法：
;   pio run -e m5core2                 # 编译 Core2
;   pio run -e m5cores3                # 编译 CoreS3
;   pio run -t upload -e m5cores3      # 烧录 CoreS3（手动加 -e 选择机型）
;   pio device monitor                 # 115200 串口监视
;
; 常见问题：Windows 上若报 `.sconsign311.dblite: No such file or directory`
; 或构建目录莫名缺失（多与杀软实时扫描/桌面云同步干扰 .pio 有关）：
;   - rmdir /s /q .pio 清一次后重试；
;   - 建议一次只编译一个环境（pio run -e <env>）；
;   - 给 .pio 加杀软排除；仓库若在 OneDrive/桌面目录下建议挪到普通盘符。
;
; 多目标混杂仓库说明（本目录同时承载 Linux/WASM/单片机等众多目标）：
;   src_dir=. 会递归收集全部源码，因此用 build_src_filter 显式排除
;   非 ESP32 目标的源码（各平台 HAL、其它入口 main_*、工具与前端目录等）。
;   ESP32 固件的入口是 linglong_m5core2.ino；其余 main*.c 一律排除。
;   新增平台无关的 .c/.cpp（如新 ui_*.c、hal_*_m5esp.cpp）无需改动本过滤
;   器即可被 ESP32 构建自动收编——与原 linglong_m5core2 独立仓库行为一致。

[platformio]
src_dir = .

[env]
; 注意：必须用 pioarduino fork（Arduino core 3.x / ESP-IDF 5.x），不能用官方 espressif32！
; 官方 7.0.1 是 Arduino core 2.0.17（IDF 4.4，GCC 8.4）：
;   - 无新版 I2S 驱动 driver/i2s_std.h（hal_audio_in 需要，且不可回退 legacy 驱动）；
;   - GCC 8.4 + -std=gnu99 无 FLT_TRUE_MIN（tensor.c 需要 C11 浮点宏）。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Animac 头文件搜索路径（vendor/Animac/ 源码随 src_dir=. 一并编译）
; B3 绘图性能优化（2026-08）：全局 -Os → -O2（图形栈/字体渲染/LLM 推理等
; 全部热点受益；固件体积约 +10%，6.5MB APP 分区可容）。若出现异常回退此行。
build_unflags = -Os
build_flags =
    -O2
    -I vendor/Animac

; ESP32 目标的源码收集范围（相对 src_dir）：
;   - 排除构建产物与其它目标专用目录（含 toolchains 交叉工具链、bin 产物）；
;   - 排除其它平台入口（main.c / main_*.c，ESP32 入口为 linglong_m5core2.ino）；
;   - 排除其它平台 HAL（*_linux / *_wasm / *_luckfox / *_mp135、M5Stack 外接
;     十六键键盘 hal_key_m5kb、MPU6050；ESP32 用的是 *_m5esp.cpp 一套）；
;   - hal_net 仅保留 stub（ESP32 无网络客户端实现，ui_llm 远端引擎走桩）；
;   - vendor/Animac/am_host.c 为 POSIX 宿主实现，与 am_host_esp32.cpp 符号
;     互斥，排除之（ESP32 由 am_host_esp32.cpp 提供宿主接口）。
build_src_filter =
    +<*>
    -<.pio/>
    -<app/> -<asr/> -<bin/> -<cuda/> -<toolchains/> -<tools/> -<tts/> -<web/> -<webgui/>
    -<main.c> -<main_*.c>
    -<asr.c> -<tts.c> -<nano_ws_server.c>
    -<hal_*_linux.c> -<hal_*_wasm.c> -<hal_*_luckfox.c> -<hal_*_mp135.c>
    -<hal_key_m5kb.cpp> -<hal_imu_mpu6050.c>
    -<vendor/Animac/am_host.c>
    -<hal_power_rpi5.c> -<hal_power_coremp135.c>

; M5Unified / M5GFX 版本与 Arduino15 staging 中最新一套（0.2.14 + 0.2.20）保持一致，
lib_deps =
    m5stack/M5Unified@0.2.14
    m5stack/M5GFX@0.2.20

; ---------------------------------------------------------------
; M5Stack Core2
; ---------------------------------------------------------------
[env:m5core2]
board = m5stack-core2
; Core2 默认分区即 16MB 布局（2×6.5MB OTA APP + 3.6MB SPIFFS），与 partitions.csv 相同
board_build.partitions = default_16MB.csv

; ---------------------------------------------------------------
; M5Stack CoreS3
; ---------------------------------------------------------------
[env:m5cores3]
board = m5stack-cores3
; CoreS3 固件约 4.7MB，预置分区方案的 APP 分区均放不下，必须用 16MB 布局
; （2×6.5MB OTA APP + 3.6MB SPIFFS，与工程根目录 partitions.csv 完全一致）
board_build.partitions = default_16MB.csv
; CoreS3 的 8MB PSRAM 为 QSPI（四线）。本机实测 OPI（八线）配置烧录后
; 报 "octal_psram: PSRAM chip is not connected, or wrong PSRAM line mode"，
; PSRAM 初始化失败（PSRAM Free=0）并崩溃。memory_type = {boot}_{psram}，
; QSPI 用 qio_qspi；若将来确认硬件为八线 PSRAM，才改为 qio_opi。
board_build.arduino.memory_type = qio_qspi
